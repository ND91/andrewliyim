# .github/workflows/deploy.yml
#
# Builds the Hugo site and deploys it to GitHub Pages.
# Triggered by:
#   • Every push to `main` (including commits from the update-publications bot)
#   • Manual "workflow_dispatch" trigger
#   • Daily rebuild at 03:00 UTC (catches any external config drift)
#
# Prerequisites (one-time MANUAL step — do this before the first run):
#   Repo → Settings → Pages → Build and deployment → Source: "GitHub Actions"

name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 3 * * *'   # Daily rebuild at 03:00 UTC
  workflow_dispatch:       # Manual trigger from Actions tab

concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

# Opt into Node.js 24 — avoids Node 20 deprecation warnings
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── JOB 1: Build ──────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: "0.128.2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Go (required for Hugo Modules)
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install Hugo (extended)
        run: |
          wget -q -O /tmp/hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i /tmp/hugo.deb

      - name: Install Dart Sass (needed by HugoBlox SCSS)
        run: sudo snap install dart-sass

      - name: Resolve & tidy Hugo modules
        # hugo mod tidy fetches all modules declared in go.mod + hugo.yaml
        # and regenerates go.sum with correct hashes — more robust than mod get
        run: hugo mod tidy

      - name: Cache Hugo Modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/hugo_cache
            /root/.cache/hugo_cache
          key: ${{ runner.os }}-hugo-${{ hashFiles('go.mod') }}
          restore-keys: |
            ${{ runner.os }}-hugo-

      - name: Configure GitHub Pages base URL
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install Node dependencies (if package.json present)
        run: '[ -f package-lock.json ] && npm ci || true'

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
          HUGO_NUMWORKERMULTIPLIER: 2
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # ── JOB 2: Deploy ─────────────────────────────────────────────────────────
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
