# .github/workflows/update-publications.yml
#
# Runs the ORCID/CrossRef fetcher weekly, commits any new publication
# Markdown files, and pushes them — which triggers the deploy workflow.
#
# Prerequisites (one-time setup — IMPORTANT):
#   Because GitHub Actions cannot trigger other Actions workflows using the
#   default GITHUB_TOKEN, you need a Personal Access Token (PAT) so that
#   the push from this job triggers the deploy workflow.
#
#   Steps:
#   1. Go to GitHub → Settings → Developer settings → Personal access tokens
#      → Tokens (classic) → Generate new token
#   2. Grant scopes:  repo  (full control of private repositories)
#   3. Copy the token value.
#   4. In your repository → Settings → Secrets and variables → Actions
#      → New repository secret → Name: GH_PAT, Value: <your token>
#
#   If you do NOT set GH_PAT, the push will still work but will NOT
#   trigger the deploy workflow automatically. You can then trigger
#   deployment manually from the Actions tab.

name: Update Publications

on:
  schedule:
    - cron: '0 5 * * 1'   # Every Monday at 05:00 UTC
  workflow_dispatch:       # Manual trigger from Actions tab

permissions:
  contents: write          # Needed to push commits

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Use PAT if available so the push triggers the deploy workflow;
          # fall back gracefully to the default token.
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('scripts/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch publications from ORCID + CrossRef
        run: python scripts/fetch_publications.py

      - name: Check whether any files changed
        id: diff
        run: |
          git diff --quiet content/publication/ \
            && echo "changed=false" >> "$GITHUB_OUTPUT" \
            || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push new publications
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "Publications Bot"
          git config user.email "actions@github.com"
          git add content/publication/
          git commit -m "chore: auto-update publications from ORCID [$(date -u +'%Y-%m-%d')]"
          git push

      - name: No new publications found
        if: steps.diff.outputs.changed == 'false'
        run: echo "No new publications. Nothing to commit."
