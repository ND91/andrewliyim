# .github/workflows/update-publications.yml
#
# Runs the ORCID + CrossRef fetcher every Monday, merges any new works
# into publications.json, and commits the result — which triggers the
# deploy workflow automatically.
#
# One-time setup:
#   Add a repo secret named GH_PAT (Personal Access Token, scope: repo)
#   so that the commit pushed here triggers the deploy workflow.
#   Without GH_PAT the commit still happens but won't trigger deploy;
#   you can then trigger it manually from the Actions tab.
#
#   Repo → Settings → Secrets and variables → Actions → New repository secret
#   Name: GH_PAT   Value: <your token>

name: Update Publications

on:
  schedule:
    - cron: '0 5 * * 1'   # Every Monday at 05:00 UTC
  workflow_dispatch:       # Manual trigger from Actions tab

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-requests

      - name: Install dependencies
        run: pip install requests

      - name: Fetch publications from ORCID + CrossRef
        run: python scripts/fetch_publications.py

      - name: Commit if publications.json changed
        run: |
          git diff --quiet publications.json && echo "No new publications." && exit 0
          git config user.name  "Publications Bot"
          git config user.email "actions@github.com"
          git add publications.json
          git commit -m "chore: update publications [$(date -u +'%Y-%m-%d')]"
          git push
