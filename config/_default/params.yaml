# Site appearance
appearance:
  mode: system          # system | light | dark
  color: emerald        # Accent colour - works well for biomed/science
  font:
    name: Atkinson Hyperlegible  # Excellent readability for academic content

# SEO
marketing:
  seo:
    site_type: Person
    local_business_type: ''
    org_name: 'Amsterdam UMC'
    description: >
      Personal academic website of Andrew Y.F. Li Yim — Tenure Track Assistant
      Professor and Bioinformatician at Amsterdam UMC, specialising in
      epigenetics, multi-omics and inflammatory diseases.
    twitter: ''

# Header / navbar
header:
  navbar:
    enable: true
    align: r              # Align nav links to the right
    show_logo: true
    show_language: false
    show_day_night: true
    show_search: true
    highlight_active_link: true

# Footer
footer:
  copyright:
    notice: >
      © {year} Andrew Y.F. Li Yim.
      Published with [HugoBlox](https://hugoblox.com).
    license:
      enable: false

# Localisation
locale:
  date_format: 'Jan 2, 2006'
  time_format: '15:04'

# Features
features:
  syntax_highlighter:
    enable: true
    extra_languages:
      - r
      - python
  math:
    enable: false
  privacy_pack:
    enable: false
  repository:
    url: 'https://github.com/YOUR-GITHUB-USERNAME/ND91'  # ← CHANGE
    content_dir: content
    branch: main
  avatar:
    gravatar: false
    shape: circle
  comment:
    provider: ''
  search:
    provider: wowchemy
  map:
    provider: ''
  feedback:
    responses:
      positive: 'Glad it was helpful!'
      negative: 'Thanks for the feedback. Help us improve by [contacting us](/#contact).'

# Extensions
extensions:
  decap_cms:
    branch: main
  academicons:
    enable: true
